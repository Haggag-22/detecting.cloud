title: AWS New Lambda Layer Attached
id: b21d1f97-55cc-4871-a097-f53803037bf5
status: experimental
description: |
    Detects when a user attaches a Lambda layer to an existing AWS Lambda function. A malicious Lambda layer could execute arbitrary code in the context of the function's IAM role, potentially granting an adversary access to resources the function has access to. This activity could indicate privilege escalation or unauthorized modification of serverless functions.
references:
    - https://docs.aws.amazon.com/lambda/latest/dg/API_UpdateFunctionConfiguration.html
    - https://github.com/clearvector/lambda-spy
    - https://attack.mitre.org/techniques/T1098
    - https://attack.mitre.org/techniques/T1098/003
    - https://attack.mitre.org/detectionstrategies/DET0096/
    - https://attack.mitre.org/detectionstrategies/DET0277/
author: Austin Songer
date: 2021-05-23
modified: 2026-07-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
    - attack.t1098.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: lambda.amazonaws.com
        eventName|startswith: UpdateFunctionConfiguration
        requestParameters|contains: 'layers'
    condition: selection
falsepositives:
    - Lambda Layer being attached may be performed by a system administrator. Verify whether the user identity, user agent, and/or hostname should be making changes in your environment.
    - Lambda Layer being attached from unfamiliar users should be investigated. If known behavior is causing false positives, it can be exempted from the rule.
level: low
