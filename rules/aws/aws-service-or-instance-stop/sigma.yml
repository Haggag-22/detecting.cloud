title: AWS Service Or Instance Stop
status: experimental
description: |
    Detects stopping of compute and database services (EC2 StopInstances, RDS StopDBInstance/StopDBCluster, ECS DeleteService/StopTask) which adversaries use to disrupt availability.
references:
    - https://attack.mitre.org/techniques/T1489/
    - https://attack.mitre.org/detectionstrategies/DET0021/
tags:
    - attack.impact
    - attack.t1489
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_ec2:
        eventSource: ec2.amazonaws.com
        eventName: StopInstances
    selection_rds:
        eventSource: rds.amazonaws.com
        eventName:
            - StopDBInstance
            - StopDBCluster
    selection_ecs:
        eventSource: ecs.amazonaws.com
        eventName:
            - DeleteService
            - StopTask
    condition: 1 of selection_*
falsepositives:
    - Planned maintenance, autoscaling, or cost-saving shutdowns.
    - Blue/green deployments stopping old services.
level: medium
