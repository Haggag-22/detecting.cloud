title: AWS IAM Additional Credentials Added
status: experimental
description: |
    Detects addition or reactivation of non-access-key IAM credentials (UploadSSHPublicKey, CreateServiceSpecificCredential, ResetServiceSpecificCredential, UpdateAccessKey activation). Adds Additional Cloud Credentials (T1098.001) coverage for credential types beyond the existing SigmaHQ CreateAccessKey backdoor rule and the S3Browser login-profile rule.
references:
    - https://attack.mitre.org/techniques/T1098/001/
    - https://attack.mitre.org/detectionstrategies/DET0096/
    - https://attack.mitre.org/detectionstrategies/DET0531/
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
    - attack.t1098.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName:
            - UploadSSHPublicKey
            - CreateServiceSpecificCredential
            - ResetServiceSpecificCredential
            - UpdateAccessKey
    condition: selection
falsepositives:
    - Legitimate credential provisioning for CodeCommit or SSH by administrators.
level: medium
