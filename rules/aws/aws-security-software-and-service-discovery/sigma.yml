title: AWS Security Software And Service Discovery
status: experimental
description: |
    Detects enumeration of AWS security services (GuardDuty, Config, Security Hub, WAF) used by adversaries to identify defensive controls before disabling or evading them.
references:
    - https://attack.mitre.org/techniques/T1518/001/
    - https://attack.mitre.org/detectionstrategies/DET0016/
tags:
    - attack.discovery
    - attack.t1518.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_guardduty:
        eventSource: guardduty.amazonaws.com
        eventName:
            - ListDetectors
            - GetDetector
    selection_config:
        eventSource: config.amazonaws.com
        eventName:
            - DescribeConfigRules
            - DescribeConfigurationRecorders
    selection_securityhub:
        eventSource: securityhub.amazonaws.com
        eventName:
            - GetFindings
            - DescribeHub
            - GetEnabledStandards
    selection_waf:
        eventSource: wafv2.amazonaws.com
        eventName: ListWebACLs
    condition: 1 of selection_*
falsepositives:
    - Security tooling and posture management solutions.
    - SOC engineers reviewing configuration.
level: medium
