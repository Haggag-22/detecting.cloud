title: AWS S3 Ransomware Via SSE-C Encryption
id: 2c17e405-30d3-4050-a052-cf358ad05bcf
status: experimental
description: |
    Detects S3 object writes that use customer-provided encryption keys (SSE-C), a technique used to
    encrypt a victim's objects with attacker-held keys and hold them for ransom (Data Encrypted for
    Impact). Aligned to MITRE ATT&CK T1486 analytic AN0606 (PutObject/UploadPart with SSE-C).
    REQUIRES S3 DATA-EVENT LOGGING: PutObject/CopyObject/UploadPart are S3 data-plane events and are
    NOT recorded by default CloudTrail management-event logging (the standard SOF-ELK ingest). Enable
    CloudTrail S3 data events on the relevant buckets for this rule to fire.
references:
    - https://attack.mitre.org/techniques/T1486/
    - https://attack.mitre.org/detectionstrategies/DET0215/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.impact
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: s3.amazonaws.com
        eventName:
            - PutObject
            - CopyObject
            - UploadPart
    selection_ssec:
        additionalEventData|contains: 'SSEApplied":"SSE_C'
    condition: all of selection*
falsepositives:
    - Legitimate applications that use SSE-C with client-managed encryption keys.
level: high
