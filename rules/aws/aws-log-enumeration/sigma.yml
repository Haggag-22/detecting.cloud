title: AWS Log Enumeration
id: d111f040-d403-470c-bbbf-ab07d4afd8e1
status: experimental
description: |
    Detects enumeration of CloudTrail and CloudWatch Logs (LookupEvents, GetTrailStatus, GetLogEvents, DescribeLogGroups) which adversaries perform to understand logging coverage before evasion.
references:
    - https://attack.mitre.org/techniques/T1654/
    - https://attack.mitre.org/detectionstrategies/DET0255/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.discovery
    - attack.t1654
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_cloudtrail:
        eventSource: cloudtrail.amazonaws.com
        eventName:
            - LookupEvents
            - GetTrailStatus
            - DescribeTrails
    selection_logs:
        eventSource: logs.amazonaws.com
        eventName:
            - GetLogEvents
            - FilterLogEvents
            - DescribeLogGroups
            - DescribeLogStreams
    condition: 1 of selection_*
falsepositives:
    - SIEM/log-forwarding integrations reading CloudTrail and CloudWatch Logs.
    - Administrators reviewing logs.
level: low
