title: AWS SES Identity Deletion
id: 3db5a682-67c1-413d-8add-85c7938afa7d
status: experimental
description: |
    Detects an instance of an Amazon Simple Email Service (SES) identity being deleted via the "DeleteIdentity" event. This action could be performed by an adversary to remove traces of their activities after using the SES identity for malicious purposes, such as sending spam or phishing emails, aligning with defense evasion tactics.
references:
    - https://attack.mitre.org/techniques/T1070/
    - https://attack.mitre.org/detectionstrategies/DET0184/
    - https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.stealth
    - attack.t1070
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'ses.amazonaws.com'
        eventName: 'DeleteIdentity'
    condition: selection
falsepositives:
    - Legitimate decommissioning of an SES identity by an administrator.
level: medium
