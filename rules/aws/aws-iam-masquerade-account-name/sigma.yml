title: AWS IAM Masquerade Account Name
id: a1b2c3d4-e5f6-4789-a012-3456789abc01
status: experimental
description: |
    Detects creation of IAM users with names that mimic AWS service or administrative accounts (Masquerade Account Name). Adversaries use convincing account names to blend into the environment.
references:
    - https://attack.mitre.org/techniques/T1036/010/
    - https://attack.mitre.org/detectionstrategies/DET0383/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.stealth
    - attack.t1036.010
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: CreateUser
        requestParameters|contains:
            - 'userName":"aws-'
            - 'userName":"AWS-'
            - 'userName":"admin'
            - 'userName":"root'
            - 'userName":"support'
            - 'userName":"service'
            - 'userName":"billing'
            - 'userName":"security'
            - 'userName":"cloudtrail'
    condition: selection
falsepositives:
    - Legitimate service account naming conventions in some organizations.
level: medium
