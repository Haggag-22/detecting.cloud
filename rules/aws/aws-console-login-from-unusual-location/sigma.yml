title: AWS Console Login From Unusual Location
id: cb7778c0-717f-4273-a7de-593cfbc13ac0
status: experimental
description: |
    Detects successful AWS console logins that originate from countries or IP
    addresses that are not recognized as legitimate for the organization. Such
    logins from unusual locations can indicate compromised credentials or
    unauthorized access.
    Behavioral rule: this rule anchors on the successful ConsoleLogin event only.
    The geo (awsRegion/country) and source IP allow-lists have no portable fixed
    values and MUST be tuned per environment by adding a negated filter for the
    organization's legitimate regions/countries and source IP ranges before
    deployment; otherwise every successful console login will match.
references:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
    - https://attack.mitre.org/techniques/T1078/004/
    - https://attack.mitre.org/detectionstrategies/DET0546/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1078
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: 'ConsoleLogin'
        responseElements|contains: 'ConsoleLogin":"Success'
    condition: selection
falsepositives:
    - Legitimate logins from trusted countries and IP addresses. Tune the geo/IP allow-list per environment.
    - Logins through services hosted through cloud providers in other regions.
level: medium
