title: AWS VPC Traffic Mirroring Configuration
id: e322b3a8-9a19-4bab-b206-2ecf9baa0732
status: experimental
description: |
    Detects creation of VPC Traffic Mirroring sessions/targets/filters, used to duplicate network traffic for capture. Adds VPC Traffic Mirroring (T1020.001) detection beyond the existing SigmaHQ RDS-focused Automated Exfiltration (T1020) rules.
references:
    - https://attack.mitre.org/techniques/T1020/001/
    - https://docs.aws.amazon.com/vpc/latest/mirroring/traffic-mirroring-how-it-works.html
    - https://attack.mitre.org/detectionstrategies/DET0403/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.exfiltration
    - attack.t1020.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ec2.amazonaws.com
        eventName:
            - CreateTrafficMirrorSession
            - CreateTrafficMirrorTarget
            - CreateTrafficMirrorFilter
    condition: selection
falsepositives:
    - Legitimate network monitoring, IDS, or troubleshooting deployments.
level: medium
