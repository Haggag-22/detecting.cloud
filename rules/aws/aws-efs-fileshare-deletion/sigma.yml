title: AWS EFS Fileshare Deletion
id: 339712b5-6f0a-4b9a-b6b4-c0decc94576e
status: experimental
description: |
    Detects when an AWS EFS Fileshare is deleted via the DeleteFileSystem API call.
    This action can indicate an attempt to disrupt availability or destroy data. Adversaries might delete file systems to impact operations or cover their tracks.
    Note that an EFS file system cannot be deleted if it has active mount targets, implying that mount targets would need to be deleted first.
references:
    - https://docs.aws.amazon.com/efs/latest/ug/API_DeleteFileSystem.html
    - https://attack.mitre.org/detectionstrategies/DET0146/
author: Austin Songer @austinsonger
date: 2026-07-15
tags:
    - attack.impact
    - attack.t1485
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: elasticfilesystem.amazonaws.com
        eventName: DeleteFileSystem
    condition: selection
falsepositives:
    - A file system may be legitimately deleted by a system or storage administrator. Verify whether the user identity, user agent, and/or hostname should be making changes in your environment.
level: medium
