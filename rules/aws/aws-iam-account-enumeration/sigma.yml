title: AWS IAM Account Enumeration
id: f304ee10-068b-475b-ab34-78eb7c04912d
status: experimental
description: |
    Detects broad IAM user/role/credential enumeration (ListUsers, ListRoles, GetAccountAuthorizationDetails, ListAccessKeys, GenerateCredentialReport). Adds general Cloud Account discovery (T1087.004) beyond the existing SigmaHQ rule which only flags GetCallerIdentity from the TruffleHog user agent.
references:
    - https://attack.mitre.org/techniques/T1087/004/
    - https://attack.mitre.org/detectionstrategies/DET0386/
    - https://attack.mitre.org/detectionstrategies/DET0587/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.discovery
    - attack.t1087
    - attack.t1087.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName:
            - ListUsers
            - ListRoles
            - GetAccountAuthorizationDetails
            - ListAccessKeys
            - GenerateCredentialReport
            - GetAccountSummary
    condition: selection
falsepositives:
    - IAM administration and access reviews.
    - Cloud security posture and credential-report tooling.
level: low
