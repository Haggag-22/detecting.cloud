title: AWS Account Password Policy Discovery
status: experimental
description: |
    Detects retrieval of the account password policy (GetAccountPasswordPolicy). Adversaries query the password policy to inform password guessing or spraying attacks.
references:
    - https://attack.mitre.org/techniques/T1201/
    - https://attack.mitre.org/detectionstrategies/DET0161/
tags:
    - attack.discovery
    - attack.t1201
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: GetAccountPasswordPolicy
    condition: selection
falsepositives:
    - Compliance/security tooling reading the password policy.
    - IAM administrators.
level: low
