# Elasticsearch output for the evidence pipeline.
#
# Mount this OVER SOF-ELK's 9900-output-elasticsearch-consolidated.conf rather
# than alongside it. Logstash concatenates every output block it finds, so two
# elasticsearch outputs means every event is indexed twice.
#
# [sof-elk][base_index] is set by 1000-preprocess-all.conf ("aws" for
# [labels][type] == "aws"). Keying off it preserves SOF-ELK's index naming, so
# the stock dashboards and index patterns work unchanged.

output {
  # Quarantine first, and the branches are mutually exclusive: a malformed event
  # still carries [sof-elk][base_index], so an `if base_index` block that ran
  # first would index it into the main index as well as here.
  if "_cloudtrail_unrecognised_shape" in [tags]
     or "_jsonparsefail_cloudtrail_records" in [tags]
     or "_jsonparsefail_cloudtrail_ndjson" in [tags] {

    # Kept, not dropped. Silently discarding malformed evidence is worse than
    # putting it somewhere an analyst can go and look at it. A non-empty
    # aws-ingest-failures-* index means something in the collection or the
    # pipeline needs attention.
    elasticsearch {
      id => "evidence-elasticsearch-quarantine"

      hosts    => [ "${ELASTICSEARCH_HOST:http://elasticsearch:9200}" ]
      user     => "${ELASTICSEARCH_USERNAME:elastic}"
      password => "${ELASTIC_PASSWORD:changeme}"

      ilm_enabled       => false
      index             => "aws-ingest-failures-%{+YYYY.MM}"
      ecs_compatibility => "disabled"
      manage_template   => false
    }

  } else if [sof-elk][base_index] {
    elasticsearch {
      id => "evidence-elasticsearch"

      hosts    => [ "${ELASTICSEARCH_HOST:http://elasticsearch:9200}" ]
      user     => "${ELASTICSEARCH_USERNAME:elastic}"
      password => "${ELASTIC_PASSWORD:changeme}"

      # SOF-ELK manages its own index templates and rolls monthly by name, so
      # ILM must stay off — letting ILM take over renames the indices out from
      # under the dashboards.
      ilm_enabled => false
      index       => "%{[sof-elk][base_index]}-%{+YYYY.MM}"

      # SOF-ELK's configs predate ECS mode and set their own field names.
      ecs_compatibility => "disabled"

      # Do not let Logstash install its own default template over SOF-ELK's.
      manage_template => false
    }
  }
}
