# Normalise both collector output shapes into what 6901-aws.conf expects.
#
# 6901-aws.conf reads everything from [raw][...] — [raw][eventName],
# [raw][userIdentity][arn], and so on. Two different inputs have to end up
# there:
#
#   Mode A (trail copy)   one object = {"Records":[ {...}, {...} ]}, usually all
#                         on a single line. Needs a json parse, then a split on
#                         Records to fan out one event per record.
#
#   Mode B (lookup)       one object = one unwrapped trail record per line. The
#                         collector already stripped the LookupEvents envelope,
#                         so this needs a json parse straight into [raw] and NO
#                         split.
#
# The two are told apart by content rather than by filename or prefix, because
# the collector deliberately gives Mode B output the same CloudTrail-style
# naming as Mode A — an analyst should not have to care which produced a file,
# and a prefix convention is something a future change could quietly break.
#
# Must be numbered below 1000 so it runs before 1000-preprocess-all.conf, and
# it deliberately does NOT set the "json" tag: 1001-preprocess-json.conf would
# then parse the whole {"Records":[...]} document into [raw] wholesale, and
# 6901 would find no [raw][eventName].
#
# This file REPLACES SOF-ELK-docker's local 0005-preprocess-aws-s3.conf. Running
# both would double-parse: 0005 does an untargeted json parse that leaves Mode B
# fields at the top level where 6901 cannot see them.

filter {
  if [labels][type] == "aws" {

    # The ![raw][eventName] guard makes this idempotent. Split re-runs the
    # filter chain over each generated event, and without the guard the second
    # pass would try to json-parse a message that no longer exists.
    if [message] and ![raw][eventName] {

      if [message] =~ /^\s*\{\s*"Records"\s*:/ {
        # --- Mode A: native CloudTrail --------------------------------------
        json {
          source        => "message"
          remove_field  => [ "message" ]
          tag_on_failure => [ "_jsonparsefail_cloudtrail_records" ]
        }

        if "_jsonparsefail_cloudtrail_records" not in [tags] {
          split {
            field => "Records"
          }
        }

      } else {
        # --- Mode B: one unwrapped record per line ---------------------------
        json {
          source         => "message"
          target         => "raw"
          remove_field   => [ "message" ]
          tag_on_failure => [ "_jsonparsefail_cloudtrail_ndjson" ]
        }
      }
    }

    # After the split each event carries one record under [Records]. 6901-aws.conf
    # performs this same rename itself, but doing it here keeps the two shapes
    # identical by the time any downstream filter sees them.
    if [Records] and ![raw][eventName] {
      mutate {
        rename => { "[Records]" => "[raw]" }
      }
    }

    # Anything that reaches this point without an eventName is not a CloudTrail
    # record. Tagging it makes the failure findable instead of letting it land
    # in Elasticsearch as an unparsed document that looks like successful
    # ingest. See the README for the query that surfaces these.
    if ![raw][eventName] and ![aws][cloudtrail][event_name] {
      mutate {
        add_tag => [ "_cloudtrail_unrecognised_shape" ]
      }
    }
  }
}
