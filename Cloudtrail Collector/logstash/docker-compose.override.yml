# Overlay for the existing sof-elk-docker stack.
#
# Copy to the repository root (next to docker-compose.yml) as
# docker-compose.override.yml — Docker Compose merges it automatically.
#
# Every config here is bind-mounted as an individual FILE into the pipeline
# directory. That is what keeps our changes out of ./sof-elk-repo, so the
# SOF-ELK checkout stays clean enough to pull upstream updates into.
#
# Note the 9900 mount: it lands on SOF-ELK's own output filename, replacing it
# rather than adding a second elasticsearch output (which would index every
# event twice).

services:
  logstash:
    build:
      context: ./logstash
      dockerfile: Dockerfile.evidence

    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - SQS_QUEUE_NAME=${SQS_QUEUE_NAME}
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-http://elasticsearch:9200}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}

    volumes:
      # Our configs, layered into SOF-ELK's pipeline directory.
      - ./Cloudtrail Collector/logstash/0002-input-sqs-s3-evidence.conf:/usr/share/logstash/pipeline/0002-input-sqs-s3-evidence.conf:ro
      - ./Cloudtrail Collector/logstash/0007-preprocess-evidence-cloudtrail.conf:/usr/share/logstash/pipeline/0007-preprocess-evidence-cloudtrail.conf:ro
      # Replaces SOF-ELK's output file at its own path.
      - ./Cloudtrail Collector/logstash/9900-output-elasticsearch-evidence.conf:/usr/share/logstash/pipeline/9900-output-elasticsearch-consolidated.conf:ro
      # Persistent queue settings.
      - ./Cloudtrail Collector/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
