# Logstash settings for the evidence ingest workers.
#
# Mount over ./logstash/logstash.yml in the existing docker-compose stack.

http.host: "0.0.0.0"

xpack.monitoring.elasticsearch.hosts: [ "http://elasticsearch:9200" ]

# SOF-ELK's configs predate ECS mode and set their own field names throughout.
pipeline.ecs_compatibility: disabled

# --- persistent queue ------------------------------------------------------
# Without this, events already taken off SQS live only in an in-memory queue.
# An Elasticsearch pause or a worker restart loses them, and because the SQS
# message was already deleted, nothing anywhere reports the gap. The PQ makes
# the loss recoverable rather than silent.
queue.type: persisted

# Backed by ./logstash-data, which is already a bind mount in the compose file,
# so the queue survives container recreation.
path.queue: /usr/share/logstash/data/queue

# Size this for the worst outage you want to ride out. At ~1 KB/event this
# holds roughly 8 million events before backpressure reaches SQS — which is the
# correct behaviour: messages stay on the queue rather than being dropped.
queue.max_bytes: 8gb

# Number of events acknowledged before an fsync checkpoint. 1024 trades a small
# amount of throughput for a bounded worst-case loss window on hard kill.
queue.checkpoint.writes: 1024

# --- pipeline --------------------------------------------------------------
pipeline.workers: 4
pipeline.batch.size: 250

# Dead-letter queue for events Elasticsearch rejects outright (mapping
# conflicts, oversized documents). Same reasoning as the quarantine index:
# a rejected event must be inspectable, not silently gone.
dead_letter_queue.enable: true
dead_letter_queue.max_bytes: 2gb
path.dead_letter_queue: /usr/share/logstash/data/dead_letter_queue

log.level: info
