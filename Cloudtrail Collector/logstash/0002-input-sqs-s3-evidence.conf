# CloudTrail evidence input — SQS-driven S3 reads.
#
# Replaces SOF-ELK's Filebeat input and the bucket-polling `s3` input.
#
# Why SQS rather than polling: the `s3` input tracks progress with a sincedb and
# re-LISTs the bucket every interval. Against an evidence set of millions of
# objects that listing never finishes, and there is no backpressure, no retry
# semantics, and no record of what failed. The queue gives all four, and lets
# workers scale horizontally by simply running more of them.
#
# Field contract with SOF-ELK: `[labels][type] => "aws"` is what gates
# 6901-aws.conf and what makes 1000-preprocess-all.conf set
# [sof-elk][base_index] to "aws". Without it the events parse as nothing and
# land in the `logstash-*` index instead.
#
# Requires the logstash-input-s3-sns-sqs plugin (see the Dockerfile in the
# README) — the bundled AWS integration has no SQS-driven S3 input.

input {
  s3snssqs {
    id => "aws-cloudtrail-evidence"

    region => "${AWS_REGION:us-east-1}"
    queue  => "${SQS_QUEUE_NAME}"

    # The SNS subscription uses raw_message_delivery = true, so the message body
    # is the S3 event itself with no SNS envelope. These two settings are a
    # matched pair: flip one without the other and every message fails to parse.
    from_sns => false

    # Gzip is detected from the object key, which is why the collector always
    # writes .json.gz.
    # Long-running reads: keep the message invisible while a large object is
    # still being processed, so it is not redelivered and ingested twice.
    visibility_timeout => 900

    # Native CloudTrail objects are a single JSON document with a Records array;
    # Mode B objects are one JSON record per line. Both arrive here as raw text
    # and are told apart in 0007 by content, not by filename.
    codec => "plain"

    add_field => {
      "[labels][type]"        => "aws"
      "[sof-elk][source]"     => "cloudtrail-evidence-sqs"
      "[evidence][pipeline]"  => "sqs-s3"
    }

    tags => [ "aws-cloudtrail-evidence" ]
  }
}
