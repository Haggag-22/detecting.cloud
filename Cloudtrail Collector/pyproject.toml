[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventra"
version = "1.0.0"
description = "Ventra — CloudTrail evidence collection for DFIR and SIEM ingest"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ventra = "collector.cli:main"
cloudtrail-collector = "collector.cli:legacy_main"

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
