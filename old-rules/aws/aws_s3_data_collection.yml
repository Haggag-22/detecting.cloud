title: AWS S3 Data Collection From Cloud Storage
id: cd313005-9842-472e-989e-b33e8d01c9a3
status: experimental
description: |
    Detects access to S3 objects and bucket metadata (GetObject, ListObjects, GetBucketPolicy/Acl) indicative of data collection from cloud storage. Object-level events require S3 data event logging to be enabled.
references:
    - https://attack.mitre.org/techniques/T1530/
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/cloudtrail-logging.html
    - https://attack.mitre.org/detectionstrategies/DET0484/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.collection
    - attack.t1530
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: s3.amazonaws.com
        eventName:
            - GetObject
            - ListObjects
            - ListObjectsV2
            - GetBucketAcl
            - GetBucketPolicy
            - GetObjectAcl
    condition: selection
falsepositives:
    - Normal application and analytics access to S3.
    - Backup and replication tooling.
level: low
