title: AWS KMS Key Policy Modified With Risky Grants
id: 6878e374-b4d3-4bd0-84a7-a15fce9e799b
status: experimental
description: |
    Detects KMS PutKeyPolicy events where the submitted policy grants public, root, or broad kms:* access.
references:
    - https://detecting.cloud/detection-engineering?rule=det-020
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: kms.amazonaws.com
        eventName: PutKeyPolicy
    selection_risky:
        requestParameters|contains:
            - '"Principal":"*"'
            - '"Principal":{"AWS":"*"}'
            - ':root"'
            - '"kms:*"'
            - '"kms:Decrypt"'
    condition: selection and selection_risky
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: high
