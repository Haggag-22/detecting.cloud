title: AWS IAM Default Policy Version Changed
id: 2027967e-5148-49d6-93ac-3c6c156e59d9
status: experimental
description: |
    Detects SetDefaultPolicyVersion which can rollback to a more permissive managed policy version.
references:
    - https://detecting.cloud/detection-engineering?rule=det-035
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: SetDefaultPolicyVersion
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: high
