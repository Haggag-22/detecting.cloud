title: AWS CodeBuild StartBuild Execution
id: 01649791-a141-44cb-9def-8500f783beb3
status: experimental
description: |
    Detects CodeBuild StartBuild requests which can execute code under a build project service role.
references:
    - https://detecting.cloud/detection-engineering?rule=det-126
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.credential-access
    - attack.t1528
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: codebuild.amazonaws.com
        eventName: StartBuild
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: medium
