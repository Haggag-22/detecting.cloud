title: AWS EC2 Serial Console SSH Public Key Sent
id: 474ec1f1-a273-41cf-bae5-2eb32fc568f3
status: experimental
description: |
    Detects SendSerialConsoleSSHPublicKey which grants low-level serial console access bypassing normal network paths.
references:
    - https://detecting.cloud/detection-engineering?rule=det-092
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.lateral-movement
    - attack.t1021
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ec2-instance-connect.amazonaws.com
        eventName: SendSerialConsoleSSHPublicKey
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: high
