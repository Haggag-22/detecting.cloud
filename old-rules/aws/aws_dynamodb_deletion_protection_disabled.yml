title: AWS DynamoDB Table Deletion Protection Disabled
id: a5664dc3-b43c-4436-96e8-022608d0e8b5
status: experimental
description: |
    Detects when deletion protection is removed from a DynamoDB table via UpdateTable.
references:
    - https://detecting.cloud/detection-engineering?rule=det-024
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.impact
    - attack.t1485
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: dynamodb.amazonaws.com
        eventName: UpdateTable
        requestParameters|contains:
            - '"deletionProtectionEnabled":false'
            - '"deletionProtectionEnabled": false'
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: medium
