title: AWS Lambda Function Created With Admin Role
id: 0f1b44ab-bce5-43a6-944f-d633a0883fc7
status: experimental
description: |
    Detects Lambda CreateFunction where the execution role resolves to admin-equivalent or high-risk IAM roles.
references:
    - https://detecting.cloud/detection-engineering?rule=det-001
    - https://detecting.cloud/detection-engineering?rule=det-012
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.privilege-escalation
    - attack.t1548
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: lambda.amazonaws.com
        eventName|startswith: CreateFunction
    selection_role:
        requestParameters|contains:
            - AdministratorAccess
            - OrganizationAccountAccessRole
            - PowerUser
            - '/Admin'
            - 'role/Admin'
    condition: selection and selection_role
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: critical
