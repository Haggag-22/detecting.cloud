title: AWS IAM Risky Managed Policy Version Reactivated
id: c3313e53-f1ee-45df-bc6b-998a1791e4c4
status: experimental
description: |
    Detects SetDefaultPolicyVersion combined with policy document patterns indicating broad administrative access.
references:
    - https://detecting.cloud/detection-engineering?rule=det-036
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: SetDefaultPolicyVersion
    selection_risky:
        requestParameters|contains:
            - '"Action":"*"'
            - '"Resource":"*"'
            - AdministratorAccess
    condition: selection and selection_risky
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: high
