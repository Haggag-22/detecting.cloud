title: AWS RDS Master Password Change
id: bb8d3183-94d6-4ef5-a6f6-fa89450bafce
status: experimental
description: |
    Detects when the master password for an AWS RDS database instance is changed via ModifyDBInstance where responseElements.pendingModifiedValues.masterUserPassword is present (returned masked). Adversaries may reset the master credential to gain or maintain access to the database, which can be a precursor to data access or exfiltration.
references:
    - https://attack.mitre.org/techniques/T1098/
    - https://attack.mitre.org/detectionstrategies/DET0096/
    - https://github.com/RhinoSecurityLabs/pacu
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.persistence
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: rds.amazonaws.com
        eventName: ModifyDBInstance
        responseElements|contains: 'masterUserPassword'
    condition: selection
falsepositives:
    - Legitimate master password rotation performed by a database administrator or automation.
level: medium
