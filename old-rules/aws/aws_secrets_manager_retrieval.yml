title: AWS Cloud Secrets Management Store Retrieval
id: 9a08107d-f051-45a4-b95f-acb5288602a9
status: experimental
description: |
    Detects retrieval of secrets from Secrets Manager (GetSecretValue, BatchGetSecretValue) and SSM Parameter Store (GetParameter/GetParameters/GetParametersByPath). Adds Cloud Secrets Management Stores (T1555.006) coverage beyond the existing SigmaHQ TruffleHog user-agent credential-scanning rule.
references:
    - https://attack.mitre.org/techniques/T1555/006/
    - https://attack.mitre.org/detectionstrategies/DET0130/
    - https://attack.mitre.org/detectionstrategies/DET0412/
    - https://attack.mitre.org/detectionstrategies/DET0430/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.credential-access
    - attack.t1555
    - attack.t1555.006
    - attack.t1552
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_secretsmanager:
        eventSource: secretsmanager.amazonaws.com
        eventName:
            - GetSecretValue
            - BatchGetSecretValue
    selection_ssm_param:
        eventSource: ssm.amazonaws.com
        eventName:
            - GetParameter
            - GetParameters
            - GetParametersByPath
    condition: 1 of selection_*
falsepositives:
    - Applications and services retrieving their own secrets at runtime.
    - CI/CD pipelines reading parameters.
level: low
