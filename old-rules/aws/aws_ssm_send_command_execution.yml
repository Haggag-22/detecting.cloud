title: AWS Cloud Administration Command Via SSM
id: 25dc7f1b-9b14-4d4c-8ee3-b26dc0867c8f
status: experimental
description: |
    Detects use of AWS Systems Manager to run commands on managed instances (SendCommand, StartSession). Adversaries abuse SSM as a cloud administration command channel to execute code on EC2 without valid host credentials.
references:
    - https://attack.mitre.org/techniques/T1651/
    - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_SendCommand.html
    - https://attack.mitre.org/detectionstrategies/DET0545/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.execution
    - attack.t1651
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ssm.amazonaws.com
        eventName:
            - SendCommand
            - StartSession
    condition: selection
falsepositives:
    - Legitimate administration and automation via Systems Manager.
level: medium
