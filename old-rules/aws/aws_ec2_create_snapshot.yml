title: AWS EC2 Snapshot Creation
id: 378dbd12-235b-42ee-be0d-11b4299e79de
status: experimental
description: |
    Detects creation of EBS snapshots (CreateSnapshot/CreateSnapshots). Adversaries create snapshots to duplicate or exfiltrate disk data as part of modifying cloud compute infrastructure. Also covers the parent Modify Cloud Compute Infrastructure (T1578) scope.
references:
    - https://attack.mitre.org/techniques/T1578/001/
    - https://attack.mitre.org/detectionstrategies/DET0308/
    - https://attack.mitre.org/detectionstrategies/DET0423/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.defense-impairment
    - attack.t1578
    - attack.t1578.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ec2.amazonaws.com
        eventName:
            - CreateSnapshot
            - CreateSnapshots
    condition: selection
falsepositives:
    - Routine backup automation and AMI creation.
level: low
