title: AWS EKS Access Entry Created
id: b09077a6-4868-409b-9669-e802a6747756
status: experimental
description: |
    Detects creation of EKS access entries establishing a principal-to-cluster authorization foothold.
references:
    - https://detecting.cloud/detection-engineering?rule=det-096
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: eks.amazonaws.com
        eventName: CreateAccessEntry
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: medium
