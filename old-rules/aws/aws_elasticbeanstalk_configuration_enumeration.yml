title: AWS Elastic Beanstalk Configuration Enumeration
id: 8ff6f3e8-1b0c-4045-986a-74536c5ce988
status: experimental
description: |
    Detects Elastic Beanstalk configuration and environment enumeration that may expose secrets or trust paths.
references:
    - https://detecting.cloud/detection-engineering?rule=det-122
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.discovery
    - attack.t1526
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: elasticbeanstalk.amazonaws.com
        eventName:
            - DescribeConfigurationSettings
            - DescribeEnvironments
            - DescribeApplications
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: medium
