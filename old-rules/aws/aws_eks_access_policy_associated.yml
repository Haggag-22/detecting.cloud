title: AWS EKS Broad Access Policy Associated
id: 483df76b-16ba-41f3-86a4-03932c5346f7
status: experimental
description: |
    Detects AssociateAccessPolicy with broad EKS admin policies at cluster scope.
references:
    - https://detecting.cloud/detection-engineering?rule=det-026
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: eks.amazonaws.com
        eventName: AssociateAccessPolicy
    selection_broad:
        requestParameters|contains:
            - AmazonEKSClusterAdminPolicy
            - AmazonEKSAdminPolicy
    condition: selection and selection_broad
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: critical
