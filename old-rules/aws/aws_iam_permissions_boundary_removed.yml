title: AWS IAM Permissions Boundary Removed
id: 2042b7bb-37b6-4c93-be33-57f223ffb6b5
status: experimental
description: |
    Detects deletion of permissions boundaries from IAM roles or users.
references:
    - https://detecting.cloud/detection-engineering?rule=det-041
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName:
            - DeleteRolePermissionsBoundary
            - DeleteUserPermissionsBoundary
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: high
