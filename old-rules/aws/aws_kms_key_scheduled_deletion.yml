title: AWS KMS Key Scheduled for Deletion
id: a972db29-9419-43a6-951c-4acd910e7e43
status: experimental
description: |
    Detects when a KMS key is scheduled for deletion, which could lead to data loss or indicate destructive activity.
references:
    - https://detecting.cloud/detection-engineering?rule=det-019
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.impact
    - attack.t1485
    - attack.t1486
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: kms.amazonaws.com
        eventName: ScheduleKeyDeletion
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: critical
