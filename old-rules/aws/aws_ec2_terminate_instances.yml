title: AWS EC2 Instance Termination
id: 9ce256d6-f217-401e-aa5e-61dd27bfbdcd
status: experimental
description: |
    Detects termination of EC2 instances (TerminateInstances). Adversaries delete cloud instances to remove forensic evidence or disrupt operations (Delete Cloud Instance).
references:
    - https://attack.mitre.org/techniques/T1578/003/
    - https://attack.mitre.org/detectionstrategies/DET0084/
    - https://attack.mitre.org/detectionstrategies/DET0308/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.defense-impairment
    - attack.t1578
    - attack.t1578.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ec2.amazonaws.com
        eventName: TerminateInstances
    condition: selection
falsepositives:
    - Autoscaling, blue/green deployments, and routine decommissioning.
level: low
