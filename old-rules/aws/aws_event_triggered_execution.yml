title: AWS Event Triggered Execution Persistence
id: b5554175-e78c-4166-8c6e-00ac63b3f0e6
status: experimental
description: |
    Detects creation of event-driven execution triggers (Lambda event source mappings, EventBridge rules/targets, S3 bucket notifications) that adversaries use to persist and execute code automatically.
references:
    - https://attack.mitre.org/techniques/T1546/
    - https://attack.mitre.org/detectionstrategies/DET0010/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1546
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_lambda:
        eventSource: lambda.amazonaws.com
        eventName:
            - CreateEventSourceMapping
            - PutFunctionEventInvokeConfig
    selection_events:
        eventSource: events.amazonaws.com
        eventName:
            - PutRule
            - PutTargets
    selection_s3_notif:
        eventSource: s3.amazonaws.com
        eventName: PutBucketNotification
    condition: 1 of selection_*
falsepositives:
    - Legitimate serverless/event-driven application deployment.
    - Infrastructure-as-code provisioning.
level: medium
