title: AWS IAM Cloud Group Enumeration
id: 0bbf1f7e-96e6-43b0-be48-b6c60d416dfe
status: experimental
description: |
    Detects enumeration of IAM groups and their memberships/policies, used by adversaries to map permission groups and find privilege escalation paths.
references:
    - https://attack.mitre.org/techniques/T1069/003/
    - https://attack.mitre.org/detectionstrategies/DET0251/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.discovery
    - attack.t1069.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName:
            - ListGroups
            - ListGroupsForUser
            - GetGroup
            - ListGroupPolicies
            - ListAttachedGroupPolicies
    condition: selection
falsepositives:
    - IAM administration tooling and console browsing.
    - Cloud security posture scanners.
level: low
