title: AWS MFA Request Generation
id: a1b2c3d4-e5f6-4789-a012-3456789abc08
status: experimental
description: |
    Detects MFA-backed console authentication events that are the observable anchor for MFA Request Generation / MFA fatigue, aligned to MITRE ATT&CK detection strategy DET0160 / AN0450. MITRE defines the high-fidelity detection as a correlation an atomic rule cannot fully express: ConsoleLogin (or AssumeRole) with repeated MFA failures followed by repeated MFA requests, tuned by FailedLoginThreshold. This rule surfaces MFA-involved console logins as the anchor for that threshold correlation.
references:
    - https://attack.mitre.org/techniques/T1621/
    - https://attack.mitre.org/detectionstrategies/DET0160/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.credential-access
    - attack.t1621
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: signin.amazonaws.com
        eventName: ConsoleLogin
        additionalEventData|contains: 'MFAUsed":"Yes'
    condition: selection
falsepositives:
    - Normal user MFA-backed console sign-ins.
level: low
