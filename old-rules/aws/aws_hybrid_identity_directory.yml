title: AWS Hybrid Identity Directory Change
id: a1b2c3d4-e5f6-4789-a012-3456789abc07
status: experimental
description: |
    Detects changes to AWS Directory Service and hybrid identity integrations (AD connectors, trusts, directory sharing) mapping to Hybrid Identity (T1556.007).
references:
    - https://attack.mitre.org/techniques/T1556/007/
    - https://attack.mitre.org/detectionstrategies/DET0104/
    - https://attack.mitre.org/detectionstrategies/DET0293/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.credential-access
    - attack.defense-impairment
    - attack.persistence
    - attack.t1556
    - attack.t1556.007
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ds.amazonaws.com
        eventName:
            - CreateMicrosoftAD
            - ConnectDirectory
            - CreateTrust
            - ShareDirectory
            - AuthorizeApplication
            - CreateConditionalForwarder
    condition: selection
falsepositives:
    - Active Directory migration, hybrid cloud onboarding, and directory administration.
level: high
