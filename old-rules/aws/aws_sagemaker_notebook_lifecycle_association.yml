title: AWS SageMaker Notebook Lifecycle Config Associated
id: 20b2bfb5-db14-47a5-a8b2-00b064b65cdb
status: experimental
description: |
    Detects SageMaker notebook instances created or updated with a lifecycle configuration attached.
references:
    - https://detecting.cloud/detection-engineering?rule=det-102
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.persistence
    - attack.t1525
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: sagemaker.amazonaws.com
        eventName:
            - CreateNotebookInstance
            - UpdateNotebookInstance
        requestParameters|contains: 'lifecycleConfigName'
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: high
