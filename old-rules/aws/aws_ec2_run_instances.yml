title: AWS EC2 Instance Creation
id: 0357be62-e77c-48fa-b779-c33b95fb890a
status: experimental
description: |
    Detects creation of EC2 instances (RunInstances). Adversaries create cloud instances to establish attacker-controlled compute within the victim environment (Create Cloud Instance).
references:
    - https://attack.mitre.org/techniques/T1578/002/
    - https://attack.mitre.org/detectionstrategies/DET0308/
    - https://attack.mitre.org/detectionstrategies/DET0449/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.defense-impairment
    - attack.t1578
    - attack.t1578.002
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: ec2.amazonaws.com
        eventName: RunInstances
    condition: selection
falsepositives:
    - Normal instance provisioning and autoscaling (very common - tune to unusual principals, regions, or off-hours).
level: low
