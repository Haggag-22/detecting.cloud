title: AWS IAM Role Trust Policy Modification
id: 34c22d32-808e-4d8c-85ea-93f898a8c465
status: experimental
description: |
    Detects modification of IAM role trust policies (UpdateAssumeRolePolicy, UpdateRole) which can weaken principal restrictions/conditions to allow unauthorized assumption. Adds Conditional Access Policies modification (T1556.009) coverage beyond the existing SigmaHQ SSO external-IdP change rule.
references:
    - https://attack.mitre.org/techniques/T1556/009/
    - https://attack.mitre.org/detectionstrategies/DET0030/
    - https://attack.mitre.org/detectionstrategies/DET0104/
author: SOF-ELK AWS ATT&CK Coverage
date: 2026-07-15
tags:
    - attack.credential-access
    - attack.defense-impairment
    - attack.persistence
    - attack.t1556
    - attack.t1556.009
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName:
            - UpdateAssumeRolePolicy
            - UpdateRole
    condition: selection
falsepositives:
    - Legitimate role trust-policy management by administrators or IaC.
level: medium
