title: AWS Organizations SCP Modified or Deleted
id: 8b0fcfcc-b697-4244-9f19-28342755594a
status: experimental
description: |
    Detects UpdatePolicy, DeletePolicy, or DetachPolicy on organization Service Control Policies.
references:
    - https://detecting.cloud/detection-engineering?rule=det-030
author: Detecting.Cloud / SOF-ELK
date: 2026-07-17
tags:
    - attack.defense-impairment
    - attack.t1562
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: organizations.amazonaws.com
        eventName:
            - UpdatePolicy
            - DeletePolicy
            - DetachPolicy
    condition: selection
falsepositives:
    - Legitimate administration, automation, or platform engineering activity.
level: critical
